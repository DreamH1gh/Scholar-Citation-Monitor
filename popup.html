<html>
<head>
<meta charset="utf-8">
<style>
  body {
      width: 400px;
      padding: 15px;
      font-family: Arial, sans-serif;
      margin: 0;
  }
  .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 10px;
  }
  .title {
      font-size: 16px;
      font-weight: bold;
      color: #333;
  }
  .last-update {
      font-size: 12px;
      color: #666;
  }
  .add-author {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
  }
  #authorUrl {
      flex: 1;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
  }
  #authorUrl:focus {
      outline: none;
      border-color: #4285f4;
      box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.2);
  }
  button {
      padding: 8px 12px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
  }
  button:hover {
      background: #3367d6;
  }
  button:disabled {
      background: #ccc;
      cursor: not-allowed;
  }
  .refresh-btn {
      background: #34a853;
  }
  .refresh-btn:hover {
      background: #2d8f47;
  }
  .author-item {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      position: relative;
      background: white;
      transition: all 0.2s ease;
  }
  .author-item:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .author-item.has-new {
      border-color: #34a853;
      background-color: #f8fff8;
      box-shadow: 0 0 0 1px rgba(52, 168, 83, 0.2);
  }
  .author-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
  }
  .author-name-link {
      font-weight: bold;
      font-size: 15px;
      color: #1a73e8;
      margin-bottom: 4px;
      flex: 1;
      padding-right: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      border-radius: 4px;
      padding: 4px 6px;
      margin: -4px -6px;
  }
  .author-name-link:hover {
      background-color: rgba(26, 115, 232, 0.1);
      text-decoration: underline;
      color: #1557b0;
  }
  .author-name-link:active {
      background-color: rgba(26, 115, 232, 0.2);
  }
  .author-info {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
      line-height: 1.4;
  }
  .citation-info {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 8px;
  }
  .citation-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 70px;
      padding: 6px;
      background: #f8f9fa;
      border-radius: 4px;
  }
  .citation-label {
      font-size: 10px;
      color: #666;
      margin-bottom: 2px;
      text-transform: uppercase;
      font-weight: 500;
  }
  .citation-value {
      font-weight: bold;
      font-size: 16px;
      color: #333;
  }
  .citation-change {
      color: #34a853;
      font-size: 12px;
      font-weight: bold;
      margin-top: 2px;
  }
  .delete-btn {
      background: #ea4335;
      color: white;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
  }
  .delete-btn:hover {
      background: #d33b2c;
  }
  .mark-read-btn {
      background: #fbbc04;
      color: #333;
      font-size: 11px;
      padding: 4px 8px;
  }
  .mark-read-btn:hover {
      background: #f9ab00;
  }
  .paper-changes-btn {
      background: #9c27b0;
      color: white;
      font-size: 11px;
      padding: 4px 8px;
  }
  .paper-changes-btn:hover {
      background: #7b1fa2;
  }
  .last-updated {
      font-size: 10px;
      color: #999;
      text-align: right;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #f0f0f0;
  }
  .empty-state {
      text-align: center;
      color: #666;
      padding: 40px 20px;
      font-size: 14px;
  }
  .new-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #34a853;
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
      z-index: 1;
  }
  .working-domain {
      color: #666;
      font-size: 11px;
      font-style: italic;
  }
  .stats-summary {
      background: #f8f9fa;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      color: #333;
      text-align: center;
      flex: 1;
      line-height: 1.4;
  }

.paper-changes-btn {
    background: #ff9800;
    color: white;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-weight: 500;
}
.paper-changes-btn:hover {
    background: #f57c00;
}

.paper-changes-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
}

.modal-content {
    background: white;
    border-radius: 8px;
    width: 95%;
    max-width: 380px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

.modal-header {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid #e0e0e0;
    background: #f8f9fa;
}

.modal-header h3 {
    margin: 0;
    font-size: 16px;
    color: #333;
}

.close-btn {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: #666;
    padding: 0;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
}

.close-btn:hover {
    background: #f0f0f0;
    color: #333;
}

.modal-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px 20px;
}

.paper-change-item {
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 12px;
    background: #fafafa;
}

.paper-title {
    font-weight: bold;
    font-size: 14px;
    color: #333;
    margin-bottom: 8px;
    line-height: 1.4;
}

.paper-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
}

.paper-year {
    font-size: 12px;
    color: #666;
    background: #e3f2fd;
    padding: 2px 6px;
    border-radius: 10px;
}

.citation-change.positive {
    color: #2e7d32;
    font-weight: bold;
    background: #e8f5e8;
    padding: 2px 6px;
    border-radius: 10px;
    font-size: 12px;
}

.citation-change.negative {
    color: #d32f2f;
    font-weight: bold;
    background: #ffebee;
    padding: 2px 6px;
    border-radius: 10px;
    font-size: 12px;
}

.paper-link {
    font-size: 12px;
    color: #1976d2;
    text-decoration: none;
}

.paper-link:hover {
    text-decoration: underline;
}

/* 引用历史 sparkline */
.history-section {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid #f0f0f0;
}
.history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    font-size: 12px;
    color: #555;
    user-select: none;
    padding: 2px 0;
}
.history-header:hover {
    color: #1a73e8;
}
.history-arrow {
    font-size: 10px;
    transition: transform 0.2s;
}
.history-content {
    margin-top: 8px;
}
.history-range {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
}
.range-btn {
    padding: 2px 8px;
    font-size: 10px;
    background: #f0f0f0;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    color: #555;
    font-weight: 500;
}
.range-btn:hover {
    background: #e0e0e0;
}
.range-btn.active {
    background: #1a73e8;
    color: white;
}
.sparkline-wrap {
    position: relative;
    width: 100%;
    height: 50px;
    padding-left: 24px;
    box-sizing: border-box;
}
.sparkline {
    width: 100%;
    height: 50px;
    display: block;
    overflow: visible;
}
.sparkline-axis-max, .sparkline-axis-min {
    position: absolute;
    left: 0;
    font-size: 9px;
    color: #888;
    line-height: 1;
    pointer-events: none;
}
.sparkline-axis-max { top: 2px; }
.sparkline-axis-min { bottom: 2px; }
.sparkline-tooltip {
    position: fixed;
    background: rgba(33, 33, 33, 0.92);
    color: white;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    pointer-events: none;
    z-index: 10001;
    display: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    line-height: 1.4;
    text-align: center;
}
.history-empty, .history-single {
    font-size: 11px;
    color: #999;
    text-align: center;
    padding: 12px 0;
}
.lang-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
    position: relative;
}
.lang-select {
    padding: 2px 4px;
    font-size: 11px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background: white;
    color: #333;
    cursor: pointer;
    flex-shrink: 0;
}
.lang-select:focus {
    outline: none;
    border-color: #4285f4;
}
.settings-btn {
    background: transparent;
    border: 1px solid #ddd;
    color: #666;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 15px;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
}
.settings-btn:hover {
    background: #f0f0f0;
    color: #333;
}
.settings-btn.active {
    background: #e8f0fe;
    color: #1a73e8;
    border-color: #1a73e8;
}
.settings-panel {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    background: white;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    padding: 12px;
    z-index: 1000;
    width: 240px;
    box-sizing: border-box;
}
.settings-panel.open {
    display: block;
}
.settings-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
}
.settings-row:last-child {
    margin-bottom: 0;
}
.settings-row > span {
    font-size: 13px;
    color: #333;
}
.toggle {
    position: relative;
    display: inline-block;
    width: 36px;
    height: 20px;
    flex-shrink: 0;
}
.toggle input {
    opacity: 0;
    width: 0;
    height: 0;
}
.toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #ccc;
    border-radius: 20px;
    transition: 0.2s;
}
.toggle-slider:before {
    content: "";
    position: absolute;
    height: 16px;
    width: 16px;
    left: 2px;
    bottom: 2px;
    background: white;
    border-radius: 50%;
    transition: 0.2s;
}
.toggle input:checked + .toggle-slider {
    background: #4285f4;
}
.toggle input:checked + .toggle-slider:before {
    transform: translateX(16px);
}

/* 新增引用明细：作者卡片内联开关 */
.citation-details-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #f0f0f0;
}
.cd-label {
    font-size: 12px;
    color: #555;
}
.toggle-mini {
    width: 28px;
    height: 16px;
}
.toggle-mini .toggle-slider:before {
    height: 12px;
    width: 12px;
}
.toggle-mini input:checked + .toggle-slider:before {
    transform: translateX(12px);
}

/* 论文变化弹窗内的新引用者区块 */
.new-citers-block {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed #e0e0e0;
}
.new-citers-empty {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed #e0e0e0;
    font-size: 12px;
    color: #888;
    font-style: italic;
    line-height: 1.5;
}
.new-citers-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    font-size: 12px;
    color: #9c27b0;
    font-weight: 500;
    user-select: none;
}
.new-citers-header:hover {
    color: #7b1fa2;
}
.new-citers-header .arrow {
    font-size: 10px;
    transition: transform 0.2s;
}
.new-citers-header.expanded .arrow {
    transform: rotate(90deg);
}
.new-citers-list {
    margin-top: 8px;
    padding-left: 8px;
    border-left: 2px solid #e1bee7;
}
.citer-item {
    margin-bottom: 8px;
    font-size: 12px;
    line-height: 1.4;
}
.citer-title {
    color: #1976d2;
    text-decoration: none;
    font-weight: 500;
}
.citer-title:hover {
    text-decoration: underline;
}
.citer-meta {
    color: #666;
    font-size: 11px;
    margin-top: 2px;
}

/* 反爬告警 banner */
.anticrawl-banner {
    background: #fff8e1;
    border: 1px solid #ffb300;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
    position: relative;
    box-shadow: 0 1px 4px rgba(255, 179, 0, 0.15);
}
.anticrawl-title {
    font-size: 13px;
    font-weight: 600;
    color: #e65100;
    margin-bottom: 4px;
    padding-right: 24px;
}
.anticrawl-body {
    font-size: 12px;
    color: #424242;
    line-height: 1.5;
    margin-bottom: 8px;
}
.anticrawl-paper {
    font-size: 11px;
    color: #666;
    background: #fff;
    padding: 4px 6px;
    border-radius: 4px;
    margin-bottom: 8px;
    border-left: 3px solid #ffb300;
    line-height: 1.4;
    /* 论文 title 可能很长，限制行数 */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.anticrawl-actions {
    display: flex;
    gap: 6px;
    align-items: center;
}
.anticrawl-open-btn {
    background: #ff9800;
    color: white;
    font-size: 12px;
    padding: 5px 12px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 500;
}
.anticrawl-open-btn:hover {
    background: #f57c00;
}
.anticrawl-verified-btn {
    background: #34a853;
    color: white;
    font-size: 12px;
    padding: 5px 12px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 500;
}
.anticrawl-verified-btn:hover {
    background: #2d8f47;
}
.anticrawl-dismiss-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    background: transparent;
    border: none;
    color: #888;
    font-size: 18px;
    cursor: pointer;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    line-height: 1;
    padding: 0;
}
.anticrawl-dismiss-btn:hover {
    background: rgba(0, 0, 0, 0.08);
    color: #424242;
}
</style>
</head>
<body>
  <div class="header">
      <div class="title">Scholar Citation Monitor</div>
      <div class="last-update" id="lastUpdate">最后更新: 从未更新</div>
  </div>

  <div class="lang-bar">
      <button id="settingsBtn" class="settings-btn" title="">⚙</button>
      <div id="settingsPanel" class="settings-panel">
          <div class="settings-row">
              <span id="labelLanguageText"></span>
              <select id="langSelect" class="lang-select">
                  <option value="zh">中文</option>
                  <option value="en">English</option>
                  <option value="de">Deutsch</option>
                  <option value="fr">Français</option>
                  <option value="ko">한국어</option>
                  <option value="ja">日本語</option>
                  <option value="es">Español</option>
                  <option value="pt">Português</option>
              </select>
          </div>
          <div class="settings-row">
              <span id="labelShowHistoryText"></span>
              <label class="toggle">
                  <input type="checkbox" id="showHistoryToggle">
                  <span class="toggle-slider"></span>
              </label>
          </div>
          <div class="settings-row">
              <span id="labelCitationDetailsText"></span>
              <label class="toggle">
                  <input type="checkbox" id="citationDetailsToggle">
                  <span class="toggle-slider"></span>
              </label>
          </div>
      </div>
      <div class="stats-summary" id="statsSummary">暂无统计数据</div>
  </div>

  <div id="antiCrawlBanner" class="anticrawl-banner" style="display:none;"></div>

  <div class="add-author">
      <input type="text" id="authorUrl" placeholder="输入 Google Scholar 作者页面 URL">
      <button id="addBtn">添加</button>
      <button id="refreshBtn" class="refresh-btn">刷新</button>
  </div>

  <div id="authorsList">
      <div class="empty-state">正在加载...</div>
  </div>

  <div id="sparklineTooltip" class="sparkline-tooltip"></div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
